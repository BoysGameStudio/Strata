name: Tool policy validation

on:
  push:
    branches: [fix/opencode-undeclared-tool-recovery]
    paths:
      - 'serve/**'
      - '.github/workflows/tool-policy-validation.yml'

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install jinja2 pytest
      - name: Baseline envelope tests
        run: python -m unittest discover -s serve -p test_tool_call_envelope.py -v
      - name: Export exact validation source
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/strata-validation-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: strata-validation-source
          path: ${{ runner.temp }}/strata-validation-source.tar
          retention-days: 1
